<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sync Feedback from Slack</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f7f7f5;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      min-height: 100vh;
      padding: 32px 16px;
    }
    .card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08), 0 0 0 1px rgba(0,0,0,0.06);
      padding: 28px;
      width: 100%;
      max-width: 580px;
    }
    .header { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
    .header h1 { font-size: 18px; font-weight: 700; color: #1a1a1a; }
    .subtitle { font-size: 13px; color: #888; margin-bottom: 24px; }

    button {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 9px 18px; border-radius: 8px; font-size: 14px;
      font-weight: 600; cursor: pointer; border: none; transition: opacity 0.15s;
    }
    button:hover { opacity: 0.85; }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-primary { background: #2f2f2f; color: #fff; }
    .btn-secondary { background: #f0f0ee; color: #444; }
    .btn-success { background: #0a7c45; color: #fff; }

    .loader {
      display: flex; flex-direction: column; align-items: center;
      gap: 14px; padding: 24px 0;
    }
    .spinner {
      width: 28px; height: 28px; border: 3px solid #eee;
      border-top-color: #2f2f2f; border-radius: 50%;
      animation: spin 0.75s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loader p { font-size: 13px; color: #666; }

    .msg-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 20px; }
    .msg-item {
      padding: 12px 14px; border: 1.5px solid #e5e5e5; border-radius: 10px;
      cursor: pointer; transition: border-color 0.15s, background 0.15s;
    }
    .msg-item.selected { border-color: #2f2f2f; background: #fafafa; }
    .msg-item:hover { border-color: #aaa; }
    .msg-row { display: flex; gap: 10px; align-items: flex-start; }
    .checkbox { font-size: 16px; margin-top: 1px; flex-shrink: 0; }
    .msg-text { font-size: 13px; color: #1a1a1a; line-height: 1.5; word-break: break-word; }
    .msg-meta { font-size: 11px; color: #aaa; margin-top: 4px; }

    .review-header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 12px;
    }
    .review-header p { font-size: 13px; color: #555; }
    .select-all-btn {
      font-size: 12px; color: #888; background: none; border: none;
      padding: 0; cursor: pointer; font-weight: 500; text-decoration: underline;
    }

    .action-row { display: flex; gap: 10px; }

    .done-box {
      background: #f0faf4; border: 1.5px solid #a8e6c0;
      border-radius: 10px; padding: 16px 18px; margin-bottom: 18px;
    }
    .done-box h3 { font-size: 14px; font-weight: 600; margin-bottom: 8px; }
    .done-box ul { padding-left: 18px; font-size: 13px; color: #444; }
    .done-box li { margin-bottom: 3px; }

    .error-box {
      background: #fff3f3; border: 1px solid #fcc; border-radius: 8px;
      padding: 12px 14px; font-size: 13px; color: #c00; margin-bottom: 16px;
      display: flex; justify-content: space-between; align-items: center;
    }
    .error-box button { background: none; border: none; color: #c00; font-weight: 700; cursor: pointer; padding: 0; }
  </style>
</head>
<body>
<div class="card">
  <div class="header">
    <span style="font-size:22px">💡</span>
    <h1>Sync Feedback from Slack</h1>
  </div>
  <p class="subtitle">Pulls Slack messages reacted with 💡 into your <strong>Product Feedback</strong> Notion database.</p>

  <div id="app"></div>
</div>

<script>
const NOTION_DS_ID = "325e2181-723d-8048-9872-000bda0f990c";
const API = "https://api.anthropic.com/v1/messages";
const MODEL = "claude-sonnet-4-20250514";
const MCP = [
  { type: "url", url: "https://mcp.slack.com/mcp", name: "slack-mcp" },
  { type: "url", url: "https://mcp.notion.com/mcp", name: "notion-mcp" }
];

let state = { phase: "idle", messages: [], selected: new Set(), log: "", synced: [], error: "" };

function render() {
  const app = document.getElementById("app");
  const { phase, messages, selected, log, synced, error } = state;

  let html = "";

  if (error) {
    html += `<div class="error-box"><span>${error}</span><button onclick="clearError()">✕</button></div>`;
  }

  if (phase === "idle") {
    html += `<button class="btn-primary" onclick="handleFetch()">🔄 Sync Feedback from Slack</button>`;
  }

  if (phase === "fetching" || phase === "syncing") {
    html += `<div class="loader"><div class="spinner"></div><p>${log || "Working..."}</p></div>`;
  }

  if (phase === "review") {
    const allSelected = selected.size === messages.length;
    html += `<div class="review-header">
      <p>Found <strong>${messages.length}</strong> message${messages.length !== 1 ? "s" : ""}. Select which to add:</p>
      <button class="select-all-btn" onclick="toggleAll()">${allSelected ? "Deselect all" : "Select all"}</button>
    </div>`;
    html += `<div class="msg-list">`;
    messages.forEach((m, i) => {
      const sel = selected.has(m.id);
      const text = m.text.length > 200 ? m.text.slice(0, 200) + "…" : m.text;
      const date = new Date(parseFloat(m.ts) * 1000).toLocaleDateString("en-GB");
      html += `<div class="msg-item ${sel ? "selected" : ""}" onclick="toggleMsg('${m.id}')">
        <div class="msg-row">
          <span class="checkbox">${sel ? "☑️" : "⬜"}</span>
          <div>
            <div class="msg-text">${escHtml(text)}</div>
            <div class="msg-meta">${escHtml(m.author)} · #${escHtml(m.channel)} · ${date}</div>
          </div>
        </div>
      </div>`;
    });
    html += `</div>`;
    html += `<div class="action-row">
      <button class="btn-success" onclick="handleSync()" ${selected.size === 0 ? "disabled" : ""}>✅ Add ${selected.size} to Notion</button>
      <button class="btn-secondary" onclick="reset()">Cancel</button>
    </div>`;
  }

  if (phase === "done") {
    html += `<div class="done-box">
      <h3>✅ ${synced.length} item${synced.length !== 1 ? "s" : ""} added to Notion!</h3>
      <ul>${synced.map(m => `<li>${escHtml(m.title)}</li>`).join("")}</ul>
    </div>
    <button class="btn-primary" onclick="reset()">🔄 Sync Again</button>`;
  }

  app.innerHTML = html;
}

function escHtml(str) {
  return String(str).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

function setLog(msg) { state.log = msg; render(); }
function clearError() { state.error = ""; render(); }
function reset() { state = { phase: "idle", messages: [], selected: new Set(), log: "", synced: [], error: "" }; render(); }

function toggleMsg(id) {
  state.selected.has(id) ? state.selected.delete(id) : state.selected.add(id);
  render();
}

function toggleAll() {
  if (state.selected.size === state.messages.length) {
    state.selected = new Set();
  } else {
    state.selected = new Set(state.messages.map(m => m.id));
  }
  render();
}

async function callClaude(system, userMsg, extraBody = {}) {
  const res = await fetch(API, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      model: MODEL, max_tokens: 1000,
      system, mcp_servers: MCP,
      messages: [{ role: "user", content: userMsg }],
      ...extraBody
    })
  });
  return res.json();
}

function parseSlackResults(data) {
  const out = [];
  for (const block of data.content || []) {
    if (block.type === "mcp_tool_result") {
      const text = block.content?.[0]?.text || "";
      try {
        const parsed = JSON.parse(text);
        if (parsed.messages?.matches) {
          for (const m of parsed.messages.matches) {
            out.push({
              id: m.ts,
              text: m.text || "",
              author: m.username || m.user || "Unknown",
              channel: m.channel?.name || "unknown",
              ts: m.ts,
              permalink: m.permalink || ""
            });
          }
        }
      } catch {}
    }
  }
  return out;
}

async function handleFetch() {
  state.phase = "fetching";
  state.error = "";
  setLog("Searching Slack for 💡 reactions...");
  try {
    const data = await callClaude(
      "You are a Slack search assistant. Use the slack_search_public_and_private tool to find messages using query: has::bulb:. Return all results.",
      "Search for all Slack messages with a 💡 (bulb) emoji reaction using has::bulb:"
    );
    const msgs = parseSlackResults(data);
    if (!msgs.length) {
      state.phase = "idle";
      state.error = "No messages with 💡 reaction found. React to some Slack messages with 💡 first!";
      render(); return;
    }
    state.messages = msgs;
    state.selected = new Set(msgs.map(m => m.id));
    state.phase = "review";
    state.log = "";
    render();
  } catch (e) {
    state.phase = "idle";
    state.error = "Failed to fetch Slack messages: " + e.message;
    render();
  }
}

async function handleSync() {
  const toSync = state.messages.filter(m => state.selected.has(m.id));
  state.phase = "syncing";
  render();
  const done = [];
  for (const msg of toSync) {
    setLog(`Sending to Notion: "${msg.text.slice(0, 40)}..."`);
    try {
      // Get a short title
      const tRes = await fetch(API, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          model: MODEL, max_tokens: 80,
          system: "Summarise the Slack message into a short 5-8 word title for a product feedback database. Return ONLY the title, no quotes or punctuation at end.",
          messages: [{ role: "user", content: msg.text }]
        })
      });
      const tData = await tRes.json();
      const title = tData.content?.[0]?.text?.trim() || msg.text.slice(0, 60);

      const date = new Date(parseFloat(msg.ts) * 1000).toLocaleDateString("en-GB", { day: "numeric", month: "long", year: "numeric" });
      const content = `**From:** ${msg.author}\n**Channel:** #${msg.channel}\n**Date:** ${date}\n\n---\n\n${msg.text}${msg.permalink ? `\n\n[View in Slack](${msg.permalink})` : ""}`;

      await callClaude(
        `You are a Notion assistant. Use notion-create-pages to create a page with data_source_id: ${NOTION_DS_ID}. Set "Name" to the title. Set content to the markdown provided.`,
        `Create a Notion page:\n- data_source_id: ${NOTION_DS_ID}\n- Name: "${title}"\n- Content:\n${content}`
      );
      done.push({ ...msg, title });
    } catch (e) {
      console.error("Failed to sync msg", msg.id, e);
    }
  }
  state.synced = done;
  state.phase = "done";
  render();
}

render();
</script>
</body>
</html>
